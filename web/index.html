<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Cityzen — Digital Gateway to Municipal, Sports Gym & Public Library Services.">

  <!-- Mobile Chrome & iOS Viewport Optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartCityzen">
  <meta name="theme-color" content="#000814">
  <meta name="msapplication-navbutton-color" content="#000814">

  <!-- Favicons and App Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Smart Cityzen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000814;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: pan-x pan-y;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* Initial Brand Loading Screen */
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #001f3f 0%, #000814 80%);
      z-index: 99999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    .brand-logo-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.45);
      animation: logoPulse 2s infinite ease-in-out;
    }

    .brand-logo-icon svg {
      width: 40px;
      height: 40px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f8fafc;
      margin: 0 0 6px 0;
      font-family: inherit;
    }

    .brand-subtitle {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: #38bdf8;
      text-transform: uppercase;
      margin: 0 0 28px 0;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Initial Brand Loading Indicator -->
  <div id="loading-splash">
    <div class="brand-logo-wrap">
      <div class="brand-logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 4.5l5 4.5v6H7v-6l5-4.5z"/>
        </svg>
      </div>
    </div>
    <div class="brand-title">Smart Cityzen</div>
    <div class="brand-subtitle">Civic Services &amp; Facilities Portal</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    window.addEventListener('load', function() {
      // Remove loading splash when flutter paints
      window.addEventListener('flutter-first-frame', function() {
        var splash = document.getElementById('loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            splash.style.display = 'none';
          }, 400);
        }
      });
      // Fallback timeout in case event is missed
      setTimeout(function() {
        var splash = document.getElementById('loading-splash');
        if (splash && splash.style.display !== 'none') {
          splash.style.opacity = '0';
          setTimeout(function() { splash.style.display = 'none'; }, 400);
        }
      }, 5000);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
