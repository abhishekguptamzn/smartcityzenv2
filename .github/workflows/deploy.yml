name: Deploy Flutter Web to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p ${{ secrets.EC2_PORT }} \
            ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare EC2
        run: |
          ssh \
            -p ${{ secrets.EC2_PORT }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /var/www/smartcityzenv2/build/web"

      - name: Deploy to EC2
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.EC2_PORT }}" \
            build/web/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/smartcityzenv2/build/web/

      - name: Fix permissions
        run: |
          ssh \
            -p ${{ secrets.EC2_PORT }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "chmod -R 755 /var/www/smartcityzenv2/build/web"

      - name: Reload Nginx
        run: |
          ssh \
            -p ${{ secrets.EC2_PORT }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo nginx -t && sudo systemctl reload nginx"

      - name: Deployment Complete
        run: echo "Flutter Web deployment completed successfully!"
