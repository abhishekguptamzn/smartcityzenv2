name: smartcityzenv2
description: "Smart Cityzen — digital gateway to civic services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Routing
  go_router: ^15.1.2

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.3

  # Models / codegen
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Secure storage & local cache
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Forms & validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2

  # Auth providers
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # UI
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  image_picker: ^1.1.2
  intl: any

  # BLE / Bluetooth Presence Verification
  flutter_blue_plus: ^1.35.0
  flutter_ble_peripheral: ^2.1.0

  # Utilities
  geolocator: ^13.0.2
  local_auth: ^2.3.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  logger: ^2.5.0
  package_info_plus: ^8.1.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#F7F9FB"
    theme_color: "#000314"

flutter_native_splash:
  color: "#F7F9FB"
  image: assets/images/splash_logo.png
  color_dark: "#000814"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#F7F9FB"
    image: assets/images/splash_logo_android12.png
    color_dark: "#000814"
    image_dark: assets/images/splash_logo_android12.png
  web: false
